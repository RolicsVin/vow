[plugin]

name="Export To Obfuscate"
description="Обфусцирует идентификаторы GDScript при экспорте проекта. Безопасный режим переименовывает только локальные переменные (как раньше), полный режим дополнительно переименовывает функции, публичные переменные и сигналы, а также синхронизирует .tscn/.tres файлы."
author="RolicsVin"
version="2.0.0"
script="plugin.gd"
